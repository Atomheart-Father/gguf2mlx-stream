[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gguf2mlx-stream"
# single source of truth: [tool.hatch.version] reads __version__ below
dynamic = ["version"]
description = "Declarative, bounded-memory GGUF -> MLX-LM checkpoint streaming transcoder"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gguf2mlx-stream contributors" }]
keywords = ["gguf", "mlx", "mlx-lm", "quantization", "conversion", "llama.cpp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Version floors below are the minimums actually validated for this release
# (mlx 0.29.1, gguf 0.19.0 and current numpy/safetensors pass the full test
# suite); older versions are untested, newer are expected to work.
# On Linux the plain `mlx` wheel ships no compute backend; the CPU backend
# comes from the `mlx[cpu]` extra (mlx-cpu), validated in CI on 3.12.
dependencies = [
    "numpy>=1.26",
    "gguf>=0.19.0",
    "pyyaml>=6.0",
    "mlx>=0.29.1; sys_platform == 'darwin'",
    "mlx[cpu]>=0.29.1; sys_platform == 'linux'",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16.8", "hatchling>=1.24"]
loadtest = ["mlx-lm>=0.31.3"]

[project.scripts]
gguf2mlx-stream = "gguf2mlx_stream.cli:main"

# No [project.urls] yet: there is no real canonical repository URL to
# advertise. Add Homepage only once a public repo exists.

[tool.hatch.version]
path = "src/gguf2mlx_stream/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gguf2mlx_stream"]
# The repository-root configs/ directory is the authoritative source for the
# official architecture configs; it is included verbatim into the wheel under
# the package so installed users can use built-in configs without a clone.
# (Editable installs fall back to the repo directory; see builtin.py.)
force-include = { "configs" = "gguf2mlx_stream/configs" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: optional local integration tests requiring real source GGUFs (deselected by default in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
