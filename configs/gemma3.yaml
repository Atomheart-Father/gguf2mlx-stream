# Declarative architecture config: Gemma 3 text models (arch "gemma3").
#
# Gemma-specific conventions live HERE (data), not in the engine:
#
# - RMSNorm "+1": llama.cpp BAKES the +1 into gemma3 norm weights when
#   writing GGUF, but mlx-lm's gemma3_text RMSNorm also adds (1 + weight)
#   at runtime. Norm weights therefore must be shipped as raw HF values:
#   every norm rule subtracts 1 via a generic `add` step (verified against
#   the HF safetensors reference: gguf = hf + 1 exactly).
# - Embeddings are scaled by sqrt(hidden_size) at runtime on both sides;
#   token_embd ships verbatim.
# - Per-head QK-norms are 1-D (head_dim,) and ship verbatim.
# - Norm naming differs from Llama: post_attention_norm ->
#   post_attention_layernorm, ffn_norm -> pre_feedforward_layernorm,
#   post_ffw_norm -> post_feedforward_layernorm.
# - Gemma3 interleaves sliding-window (local) and global attention every
#   sliding_window_pattern layers; this affects runtime masking only and is
#   carried in config.json, not in tensor transforms.
# - GGUF carries no rope-local / pattern metadata; the family constants
#   (rope_local_base_freq, sliding_window_pattern) are declared below with
#   --source-config override paths.

architecture:
  id: gemma3
  gguf_arch: gemma3
  description: >
    Gemma 3 text model (sliding-window + global attention interleave) in
    llama.cpp GGUF layout.

dims:
  hidden_size: [gguf:embedding_length, ref:hidden_size]
  n_layers: [gguf:block_count, ref:num_hidden_layers]
  vocab_size: [gguf:vocab_size, tshape:token_embd.weight.0, ref:vocab_size]
  n_heads: [gguf:attention.head_count, ref:num_attention_heads]
  n_kv_heads: [gguf:attention.head_count_kv, ref:num_key_value_heads]
  head_dim: [gguf:attention.key_length, ref:head_dim]
  intermediate_size: [gguf:feed_forward_length, ref:intermediate_size]
  rms_norm_eps: [gguf:attention.layer_norm_rms_epsilon, ref:rms_norm_eps]
  rope_theta: [gguf:rope.freq_base, ref:rope_theta]
  sliding_window: [gguf:attention.sliding_window, ref:sliding_window]

rules:
  - name: embeddings
    match: "token_embd\\.weight"
    dest: "model.embed_tokens.weight"
    expect_shape: [vocab_size, hidden_size]

  - name: lm_head
    match: "output\\.weight"
    dest: "lm_head.weight"
    expect_shape: [vocab_size, hidden_size]
    optional: true

  - name: final_norm
    match: "output_norm\\.weight"
    dest: "model.norm.weight"
    expect_shape: [hidden_size]
    steps:
      - {op: add, args: {value: -1}}
    quantize: false
    dtype: float32

  - name: input_layernorm
    match: "blk\\.(?P<n>\\d+)\\.attn_norm\\.weight"
    dest: "model.layers.{n}.input_layernorm.weight"
    expect_shape: [hidden_size]
    steps:
      - {op: add, args: {value: -1}}
    quantize: false
    dtype: float32

  - name: post_attention_layernorm
    match: "blk\\.(?P<n>\\d+)\\.post_attention_norm\\.weight"
    dest: "model.layers.{n}.post_attention_layernorm.weight"
    expect_shape: [hidden_size]
    steps:
      - {op: add, args: {value: -1}}
    quantize: false
    dtype: float32

  - name: pre_feedforward_layernorm
    match: "blk\\.(?P<n>\\d+)\\.ffn_norm\\.weight"
    dest: "model.layers.{n}.pre_feedforward_layernorm.weight"
    expect_shape: [hidden_size]
    steps:
      - {op: add, args: {value: -1}}
    quantize: false
    dtype: float32

  - name: post_feedforward_layernorm
    match: "blk\\.(?P<n>\\d+)\\.post_ffw_norm\\.weight"
    dest: "model.layers.{n}.post_feedforward_layernorm.weight"
    expect_shape: [hidden_size]
    steps:
      - {op: add, args: {value: -1}}
    quantize: false
    dtype: float32

  - name: attn_q
    match: "blk\\.(?P<n>\\d+)\\.attn_q\\.weight"
    dest: "model.layers.{n}.self_attn.q_proj.weight"
    expect_shape: [{mul: [n_heads, head_dim]}, hidden_size]

  - name: attn_k
    match: "blk\\.(?P<n>\\d+)\\.attn_k\\.weight"
    dest: "model.layers.{n}.self_attn.k_proj.weight"
    expect_shape: [{mul: [n_kv_heads, head_dim]}, hidden_size]

  - name: attn_v
    match: "blk\\.(?P<n>\\d+)\\.attn_v\\.weight"
    dest: "model.layers.{n}.self_attn.v_proj.weight"
    expect_shape: [{mul: [n_kv_heads, head_dim]}, hidden_size]

  - name: attn_o
    match: "blk\\.(?P<n>\\d+)\\.attn_output\\.weight"
    dest: "model.layers.{n}.self_attn.o_proj.weight"
    expect_shape: [hidden_size, {mul: [n_heads, head_dim]}]

  - name: q_norm
    match: "blk\\.(?P<n>\\d+)\\.attn_q_norm\\.weight"
    dest: "model.layers.{n}.self_attn.q_norm.weight"
    expect_shape: [head_dim]
    steps:
      - {op: add, args: {value: -1}}
    quantize: false
    dtype: float32

  - name: k_norm
    match: "blk\\.(?P<n>\\d+)\\.attn_k_norm\\.weight"
    dest: "model.layers.{n}.self_attn.k_norm.weight"
    expect_shape: [head_dim]
    steps:
      - {op: add, args: {value: -1}}
    quantize: false
    dtype: float32

  - name: ffn_gate
    match: "blk\\.(?P<n>\\d+)\\.ffn_gate\\.weight"
    dest: "model.layers.{n}.mlp.gate_proj.weight"
    expect_shape: [intermediate_size, hidden_size]

  - name: ffn_up
    match: "blk\\.(?P<n>\\d+)\\.ffn_up\\.weight"
    dest: "model.layers.{n}.mlp.up_proj.weight"
    expect_shape: [intermediate_size, hidden_size]

  - name: ffn_down
    match: "blk\\.(?P<n>\\d+)\\.ffn_down\\.weight"
    dest: "model.layers.{n}.mlp.down_proj.weight"
    expect_shape: [hidden_size, intermediate_size]

coverage:
  per_layer_required:
    - model.layers.{layer}.input_layernorm.weight
    - model.layers.{layer}.post_attention_layernorm.weight
    - model.layers.{layer}.pre_feedforward_layernorm.weight
    - model.layers.{layer}.post_feedforward_layernorm.weight
    - model.layers.{layer}.self_attn.q_norm.weight
    - model.layers.{layer}.self_attn.k_norm.weight
    - model.layers.{layer}.mlp.gate_proj.weight
    - model.layers.{layer}.mlp.up_proj.weight
    - model.layers.{layer}.mlp.down_proj.weight
  per_layer_alternatives:
    - - model.layers.{layer}.self_attn.q_proj.weight

output:
  model_type: gemma3_text
  architectures: ["Gemma3ForCausalLM"]
  top_level:
    tie_word_embeddings: {not: [has:output.weight]}
  text_config:
    hidden_size: [hidden_size]
    num_hidden_layers: [n_layers]
    vocab_size: [vocab_size]
    num_attention_heads: [n_heads]
    num_key_value_heads: [n_kv_heads]
    head_dim: [head_dim]
    intermediate_size: [intermediate_size]
    rms_norm_eps: [rms_norm_eps]
    max_position_embeddings: [gguf:context_length, ref:max_position_embeddings]
    rope_theta: [rope_theta]
    # Gemma3 family constants absent from GGUF metadata
    rope_local_base_freq: [ref:rope_local_base_freq, 10000.0]
    sliding_window: [sliding_window]
    sliding_window_pattern: [ref:sliding_window_pattern, 6]
    query_pre_attn_scalar: [head_dim]
    rope_scaling: [ref:rope_scaling, null]
    attention_bias: [gguf:attention.bias, false]
    attention_dropout: 0.0
    eos_token_id: [gguf:tokenizer.ggml.eos_token_id, ref:eos_token_id, null]
    bos_token_id: [gguf:tokenizer.ggml.bos_token_id, ref:bos_token_id, null]
    pad_token_id: [gguf:tokenizer.ggml.pad_token_id, ref:pad_token_id, null]
  required_fields:
    - tie_word_embeddings
    - hidden_size
    - num_hidden_layers
    - vocab_size
    - num_attention_heads
    - num_key_value_heads
    - head_dim
    - intermediate_size
    - rms_norm_eps
    - max_position_embeddings
    - rope_theta
    - rope_local_base_freq
    - sliding_window
    - sliding_window_pattern
    - query_pre_attn_scalar
    - attention_bias
    - attention_dropout
  reference_config:
    drop_fields: [architectures, model_type, rope_scaling, rope_local_base_freq,
                  sliding_window_pattern, attention_bias, attention_dropout,
                  tie_word_embeddings, bos_token_id, eos_token_id, pad_token_id]
  tokenizer_files:
    - tokenizer.json
    - tokenizer_config.json
    - generation_config.json
    - special_tokens_map.json
  max_shard_bytes: 4294967296
