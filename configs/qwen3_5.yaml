# Declarative architecture config: Qwen3.5 hybrid text models.
#
# Applies to llama.cpp GGUF exports of the Qwen3.5 family (hybrid gated
# DeltaNet linear-attention layers interleaved with full attention every
# `full_attention_interval` layers).
#
# Identifier: current llama.cpp writes general.architecture = "qwen35" with
# architecture-prefixed metadata (qwen35.ssm.*). The legacy "qwen3_5_text"
# identifier (early community exports using linear_* metadata keys) is kept
# as a secondary alias; such files must either carry nextn metadata or be
# converted with --source-config for num_hidden_layers.
#
# Non-obvious conventions (numerically verified against the reference
# conversion):
#
# 1. RMSNorm "+1": llama.cpp bakes the +1 into norm weights. Norms are
#    shipped verbatim; because conv1d is written in sanitized (dim,k,1)
#    form and no mtp keys are present, mlx-lm's qwen3_5 sanitize does NOT
#    re-add one.
# 2. GDN v-head permutation: llama.cpp stores v-head tensors in
#    group-interleaved order concat(hf[j::ratio] for j in range(ratio)),
#    ratio = value heads / kv-head groups (2 for Qwen3.5-9B, 1 for 0.8B).
#    The `qwen35_v_head_unpermute` plugin resolves the geometry from dims
#    and delegates to the generic reorder_grouped_heads operator.
# 3. A_log: GGUF ssm_a holds -exp(A_log) in GGUF head order, hence the
#    pipeline unpermute -> neg -> log.
# 4. conv1d: (dim, k) -> (dim, k, 1) via unsqueeze(-1).
# 5. MTP/NextN: blocks [n_layers, total_blocks) are explicitly DROPPED via
#    a range drop rule driven by nextn_predict_layers — never by silently
#    falling outside layer coverage.
# 6. Embeddings may be tied (0.8B) or untied (9B); tie_word_embeddings is
#    derived from the presence of output.weight, and the lm_head rule is
#    optional.
# 7. Output config uses model_type "qwen3_5" with text fields nested under
#    "text_config" for the current mlx-lm line. All fields the runtime
#    reads are emitted explicitly (see required_fields) — nothing is left
#    to mlx-lm defaults.

architecture:
  id: qwen3_5
  aliases: [qwen3_5_text]
  gguf_arch: [qwen35, qwen3_5_text]
  description: >
    Qwen3.5 hybrid text model (GDN linear attention + periodic full
    attention) in llama.cpp GGUF layout.

# Dimensions resolve from GGUF metadata first; list values are fallback
# chains. GGUF-only conversion (no reference config) is the normal path.
dims:
  hidden_size: [gguf:embedding_length, ref:hidden_size]
  total_blocks: [gguf:block_count]
  nextn_predict_layers: [gguf:nextn_predict_layers, 0]
  # llama.cpp block_count INCLUDES NextN/MTP blocks.
  n_layers: [{sub: [gguf:block_count, nextn_predict_layers]}, ref:num_hidden_layers]
  vocab_size: [gguf:vocab_size, tshape:token_embd.weight.0, ref:vocab_size]
  n_heads: [gguf:attention.head_count, ref:num_attention_heads]
  n_kv_heads: [gguf:attention.head_count_kv, ref:num_key_value_heads]
  head_dim: [gguf:attention.key_length, ref:head_dim]
  intermediate_size: [gguf:feed_forward_length, ref:intermediate_size]
  linear_num_key_heads: [gguf:ssm.group_count, gguf:linear_num_key_heads, ref:linear_num_key_heads]
  linear_key_head_dim: [gguf:ssm.state_size, gguf:linear_key_head_dim, ref:linear_key_head_dim]
  linear_num_value_heads: [gguf:ssm.time_step_rank, gguf:linear_num_value_heads, ref:linear_num_value_heads]
  # per-head value dim = ssm.inner_size / v-heads
  linear_value_head_dim: [{div: [gguf:ssm.inner_size, gguf:ssm.time_step_rank]}, gguf:linear_value_head_dim, ref:linear_value_head_dim]
  linear_conv_kernel_dim: [gguf:ssm.conv_kernel, gguf:linear_conv_kernel_dim, ref:linear_conv_kernel_dim]
  full_attention_interval: [gguf:full_attention_interval, ref:full_attention_interval, 4]
  key_dim: {mul: [linear_num_key_heads, linear_key_head_dim]}
  value_dim: {mul: [linear_num_value_heads, linear_value_head_dim]}
  conv_dim: {add: [{mul: [2, key_dim]}, value_dim]}
  rms_norm_eps: [gguf:attention.layer_norm_rms_epsilon, ref:rms_norm_eps]
  rope_theta: [gguf:rope.freq_base, ref:rope_parameters.rope_theta]
  rope_dim: [gguf:rope.dimension_count, ref:rope_parameters.partial_rotary_factor]

rules:
  # ---- MTP / next-token-prediction blocks: explicitly dropped via the
  # reserved {i} range form (first rule wins). Empty when nextn=0. ----
  - name: mtp_drop
    match: "blk\\.{i}\\..*"
    drop: true
    range: {start: n_layers, end: total_blocks}

  # ---- global ----
  - name: embeddings
    match: "token_embd\\.weight"
    dest: "language_model.model.embed_tokens.weight"
    expect_shape: [vocab_size, hidden_size]

  - name: lm_head
    match: "output\\.weight"
    dest: "language_model.lm_head.weight"
    expect_shape: [vocab_size, hidden_size]
    optional: true

  - name: final_norm
    match: "output_norm\\.weight"
    dest: "language_model.model.norm.weight"
    expect_shape: [hidden_size]
    quantize: false
    dtype: float32

  # ---- per-layer norms (verbatim, +1 already baked in by llama.cpp) ----
  - name: input_layernorm
    match: "blk\\.(?P<n>\\d+)\\.attn_norm\\.weight"
    dest: "language_model.model.layers.{n}.input_layernorm.weight"
    expect_shape: [hidden_size]
    quantize: false
    dtype: float32

  - name: post_attention_layernorm
    match: "blk\\.(?P<n>\\d+)\\.post_attention_norm\\.weight"
    dest: "language_model.model.layers.{n}.post_attention_layernorm.weight"
    expect_shape: [hidden_size]
    quantize: false
    dtype: float32

  # ---- full-attention layers (q rows carry a fused [q; gate]) ----
  - name: full_attn_q
    match: "blk\\.(?P<n>\\d+)\\.attn_q\\.weight"
    dest: "language_model.model.layers.{n}.self_attn.q_proj.weight"
    expect_shape: [{mul: [2, n_heads, head_dim]}, hidden_size]

  - name: full_attn_k
    match: "blk\\.(?P<n>\\d+)\\.attn_k\\.weight"
    dest: "language_model.model.layers.{n}.self_attn.k_proj.weight"
    expect_shape: [{mul: [n_kv_heads, head_dim]}, hidden_size]

  - name: full_attn_v
    match: "blk\\.(?P<n>\\d+)\\.attn_v\\.weight"
    dest: "language_model.model.layers.{n}.self_attn.v_proj.weight"
    expect_shape: [{mul: [n_kv_heads, head_dim]}, hidden_size]

  - name: full_attn_o
    match: "blk\\.(?P<n>\\d+)\\.attn_output\\.weight"
    dest: "language_model.model.layers.{n}.self_attn.o_proj.weight"
    expect_shape: [hidden_size, {mul: [n_heads, head_dim]}]

  - name: full_attn_q_norm
    match: "blk\\.(?P<n>\\d+)\\.attn_q_norm\\.weight"
    dest: "language_model.model.layers.{n}.self_attn.q_norm.weight"
    expect_shape: [head_dim]
    quantize: false
    dtype: float32

  - name: full_attn_k_norm
    match: "blk\\.(?P<n>\\d+)\\.attn_k_norm\\.weight"
    dest: "language_model.model.layers.{n}.self_attn.k_norm.weight"
    expect_shape: [head_dim]
    quantize: false
    dtype: float32

  # ---- GDN linear-attention layers ----
  - name: gdn_in_proj_qkv
    match: "blk\\.(?P<n>\\d+)\\.attn_qkv\\.weight"
    dest: "language_model.model.layers.{n}.linear_attn.in_proj_qkv.weight"
    expect_shape: [conv_dim, hidden_size]
    inputs:
      qk: {slice: {axis: 0, lo: 0, hi: {mul: [2, key_dim]}}}
      v:  {slice: {axis: 0, lo: {mul: [2, key_dim]}, hi: conv_dim}}
    steps:
      - {op: qwen35_v_head_unpermute, input: v, output: v_nat, args: {axis: 0}}
      - {op: concat, inputs: [qk, v_nat], args: {axis: 0}}

  - name: gdn_in_proj_z
    match: "blk\\.(?P<n>\\d+)\\.attn_gate\\.weight"
    dest: "language_model.model.layers.{n}.linear_attn.in_proj_z.weight"
    expect_shape: [value_dim, hidden_size]
    steps:
      - {op: qwen35_v_head_unpermute, args: {axis: 0}}

  - name: gdn_in_proj_a
    match: "blk\\.(?P<n>\\d+)\\.ssm_alpha\\.weight"
    dest: "language_model.model.layers.{n}.linear_attn.in_proj_a.weight"
    expect_shape: [linear_num_value_heads, hidden_size]
    steps:
      - {op: qwen35_v_head_unpermute, args: {axis: 0, block: 1}}

  - name: gdn_in_proj_b
    match: "blk\\.(?P<n>\\d+)\\.ssm_beta\\.weight"
    dest: "language_model.model.layers.{n}.linear_attn.in_proj_b.weight"
    expect_shape: [linear_num_value_heads, hidden_size]
    steps:
      - {op: qwen35_v_head_unpermute, args: {axis: 0, block: 1}}

  - name: gdn_out_proj
    match: "blk\\.(?P<n>\\d+)\\.ssm_out\\.weight"
    dest: "language_model.model.layers.{n}.linear_attn.out_proj.weight"
    expect_shape: [hidden_size, value_dim]
    steps:
      - {op: qwen35_v_head_unpermute, args: {axis: 1}}

  - name: gdn_conv1d
    match: "blk\\.(?P<n>\\d+)\\.ssm_conv1d\\.weight"
    dest: "language_model.model.layers.{n}.linear_attn.conv1d.weight"
    expect_shape: [conv_dim, linear_conv_kernel_dim]
    quantize: false
    dtype: float32
    inputs:
      qk: {slice: {axis: 0, lo: 0, hi: {mul: [2, key_dim]}}}
      v:  {slice: {axis: 0, lo: {mul: [2, key_dim]}, hi: conv_dim}}
    steps:
      - {op: qwen35_v_head_unpermute, input: v, output: v_nat, args: {axis: 0}}
      - {op: concat, inputs: [qk, v_nat], args: {axis: 0}}
      - {op: unsqueeze, input: "_", args: {axis: -1}}

  - name: gdn_dt_bias
    match: "blk\\.(?P<n>\\d+)\\.ssm_dt\\.bias"
    dest: "language_model.model.layers.{n}.linear_attn.dt_bias"
    expect_shape: [linear_num_value_heads]
    quantize: false
    dtype: float32
    steps:
      - {op: qwen35_v_head_unpermute, args: {axis: 0, block: 1}}

  # A_log = log(-unpermute(ssm_a)); neg/log are generic operators.
  - name: gdn_a_log
    match: "blk\\.(?P<n>\\d+)\\.ssm_a"
    dest: "language_model.model.layers.{n}.linear_attn.A_log"
    expect_shape: [linear_num_value_heads]
    quantize: false
    dtype: float32
    steps:
      - {op: qwen35_v_head_unpermute, args: {axis: 0, block: 1}}
      - {op: neg}
      - {op: log}

  - name: gdn_norm
    match: "blk\\.(?P<n>\\d+)\\.ssm_norm\\.weight"
    dest: "language_model.model.layers.{n}.linear_attn.norm.weight"
    expect_shape: [linear_value_head_dim]
    quantize: false
    dtype: float32

  # ---- MLP (shared by both layer kinds) ----
  - name: ffn_gate
    match: "blk\\.(?P<n>\\d+)\\.ffn_gate\\.weight"
    dest: "language_model.model.layers.{n}.mlp.gate_proj.weight"
    expect_shape: [intermediate_size, hidden_size]

  - name: ffn_up
    match: "blk\\.(?P<n>\\d+)\\.ffn_up\\.weight"
    dest: "language_model.model.layers.{n}.mlp.up_proj.weight"
    expect_shape: [intermediate_size, hidden_size]

  - name: ffn_down
    match: "blk\\.(?P<n>\\d+)\\.ffn_down\\.weight"
    dest: "language_model.model.layers.{n}.mlp.down_proj.weight"
    expect_shape: [hidden_size, intermediate_size]

coverage:
  per_layer_required:
    - language_model.model.layers.{layer}.input_layernorm.weight
    - language_model.model.layers.{layer}.post_attention_layernorm.weight
    - language_model.model.layers.{layer}.mlp.gate_proj.weight
    - language_model.model.layers.{layer}.mlp.up_proj.weight
    - language_model.model.layers.{layer}.mlp.down_proj.weight
  per_layer_alternatives:
    - - language_model.model.layers.{layer}.self_attn.q_proj.weight
      - language_model.model.layers.{layer}.linear_attn.in_proj_qkv.weight

output:
  model_type: qwen3_5
  architectures: ["Qwen3_5ForCausalLM"]
  nest_config_under: text_config
  top_level:
    # tied when the GGUF has no standalone output.weight (e.g. 0.8B)
    tie_word_embeddings: {not: [has:output.weight]}
  text_config:
    hidden_size: [hidden_size]
    num_hidden_layers: [n_layers]
    vocab_size: [vocab_size]
    num_attention_heads: [n_heads]
    num_key_value_heads: [n_kv_heads]
    head_dim: [head_dim]
    intermediate_size: [intermediate_size]
    linear_num_value_heads: [linear_num_value_heads]
    linear_num_key_heads: [linear_num_key_heads]
    linear_key_head_dim: [linear_key_head_dim]
    linear_value_head_dim: [linear_value_head_dim]
    linear_conv_kernel_dim: [linear_conv_kernel_dim]
    full_attention_interval: [full_attention_interval]
    # mirrors top-level tie_word_embeddings: mlx-lm reads it from the
    # text-config args when constructing the model
    tie_word_embeddings: {not: [has:output.weight]}
    rms_norm_eps: [rms_norm_eps]
    max_position_embeddings: [gguf:context_length, ref:max_position_embeddings]
    attention_bias: [gguf:attention.bias, false]
    attention_dropout: 0.0
    attn_output_gate: true
    hidden_act: silu
    rope_parameters:
      rope_type: default
      rope_theta: [rope_theta]
      partial_rotary_factor: [{div: [rope_dim, head_dim]}]
    eos_token_id: [gguf:tokenizer.ggml.eos_token_id, ref:eos_token_id, null]
    bos_token_id: [gguf:tokenizer.ggml.bos_token_id, ref:bos_token_id, null]
    pad_token_id: [gguf:tokenizer.ggml.pad_token_id, ref:pad_token_id, null]
  required_fields:
    - tie_word_embeddings
    - text_config.hidden_size
    - text_config.num_hidden_layers
    - text_config.vocab_size
    - text_config.num_attention_heads
    - text_config.num_key_value_heads
    - text_config.head_dim
    - text_config.intermediate_size
    - text_config.linear_num_value_heads
    - text_config.linear_num_key_heads
    - text_config.linear_key_head_dim
    - text_config.linear_value_head_dim
    - text_config.linear_conv_kernel_dim
    - text_config.full_attention_interval
    - text_config.rms_norm_eps
    - text_config.max_position_embeddings
    - text_config.attention_bias
    - text_config.attention_dropout
    - text_config.attn_output_gate
    - text_config.hidden_act
    - text_config.rope_parameters.rope_theta
    - text_config.rope_parameters.partial_rotary_factor
  reference_config:
    drop_fields: [architectures, model_name, unsloth_version, rope_parameters,
                  attention_bias, attention_dropout, attn_output_gate, hidden_act]
  tokenizer_files:
    - tokenizer.json
    - tokenizer_config.json
    - chat_template.jinja
    - generation_config.json
    - special_tokens_map.json
    - merges.txt
    - vocab.json
  max_shard_bytes: 4294967296
