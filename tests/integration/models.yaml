# Pinned real-world integration fixtures for the release matrix.
#
# Every entry is a single small public GGUF file (never a full repo clone,
# never a BF16 checkpoint). Revisions are pinned commit SHAs; sha256 values
# are filled in from the verified download log. Files are fetched by
# scripts/fetch_integration_models.py into $GGUF2MLX_INTEGRATION_DIR
# (default <repo>/.integration-models, git-ignored) and are never committed.

